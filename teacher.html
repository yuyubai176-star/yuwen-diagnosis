<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文学情诊断 · 教师后台</title>
<style>
:root {
  --red:#B83A2A; --gold:#B8860B; --cream:#FBF7F2; --ink:#2C1810;
  --ink-light:#5E5046; --white:#FFF; --border:#E0D5C9; --bg-card:#FFFBF7;
  --green:#5B8C5A; --blue:#4A7B9D; --orange:#C77826;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:24px 20px}

.header{text-align:center;padding:32px 0 20px}
.header .icon{font-size:40px;margin-bottom:6px}
.header h1{font-size:26px;color:var(--red);font-weight:700;letter-spacing:3px;margin-bottom:4px}
.header .sub{font-size:13px;color:var(--ink-light);letter-spacing:1px}

.card{background:var(--bg-card);border-radius:14px;padding:20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(44,24,16,0.04);border:1px solid var(--border)}
.card h3{font-size:15px;color:var(--ink);margin-bottom:10px}
.card h4{font-size:14px;color:var(--ink);margin-bottom:8px;padding-left:10px;border-left:3px solid var(--red)}

.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--white);border-radius:12px;padding:4px;border:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-light);transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--red);color:#fff}

.btn{display:inline-block;padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:1px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-outline{background:var(--white);color:var(--red);border:2px solid var(--red)}
.btn-outline:hover{background:#FFF5F3}
.btn-small{padding:6px 14px;font-size:12px}
.btn-danger{background:var(--white);color:#C0392B;border:2px solid #C0392B}
.btn-danger:hover{background:#FDEDEC}

textarea{width:100%;min-height:100px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:monospace;resize:vertical;outline:none;background:var(--white);line-height:1.6}
textarea:focus{border-color:var(--gold)}
input[type=text],input[type=number],select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--white)}
input:focus,select:focus{border-color:var(--gold)}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat-card{background:var(--white);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)}
.stat-card .num{font-size:32px;font-weight:700;color:var(--red)}
.stat-card .lbl{font-size:12px;color:var(--ink-light);margin-top:4px}

.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-wrap{max-width:100%}
.chart-wrap canvas{width:100%!important;height:auto!important}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);color:var(--ink-light);font-weight:600;font-size:11px;letter-spacing:1px}
td{padding:10px 8px;border-bottom:1px solid var(--border);color:var(--ink)}
tr:hover td{background:var(--cream)}
.clickable{cursor:pointer;color:var(--red);font-weight:600}
.clickable:hover{text-decoration:underline}

.tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:1px}
.tag-p1{background:#FFF0EE;color:var(--red)}
.tag-p2{background:#FFF5F0;color:var(--orange)}
.tag-p3{background:#EEF4F0;color:var(--green)}
.tag-p4{background:#F0F0F8;color:var(--blue)}
.tag-p5{background:#F3F0EB;color:#8B7355}
.tag-p6{background:#FFFBF0;color:var(--gold)}
.tag-p7{background:#F0F4F8;color:#5B7A9D}

.bar-wrap{margin:6px 0;display:flex;align-items:center;gap:8px}
.bar-lbl{width:100px;font-size:12px;color:var(--ink);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--cream);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px;transition:width .4s}
.bar-val{width:36px;font-size:12px;color:var(--ink-light);flex-shrink:0}

.domain-card{border-left:4px solid var(--gold);padding:8px 14px;margin-bottom:8px;background:var(--white);border-radius:0 10px 10px 0}
.domain-card strong{color:var(--ink)}
.domain-card .domain-score{float:right;font-weight:700;color:var(--red)}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,24,16,0.4);z-index:100;justify-content:center;align-items:flex-start;padding-top:40px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-card);border-radius:16px;padding:28px 24px;max-width:700px;width:95%;margin-bottom:40px;position:relative;box-shadow:0 8px 30px rgba(44,24,16,0.15)}
.modal-close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:var(--ink-light);background:none;border:none}
.modal-close:hover{color:var(--red)}

.section-title{font-size:13px;font-weight:700;color:var(--ink);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);letter-spacing:1px}

.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filter-bar select{min-width:120px}

.footer-note{text-align:center;padding:16px 0;font-size:11px;color:var(--ink-light)}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-light);font-size:14px;line-height:2}

.advice-item{padding:11px 13px;margin-bottom:6px;background:var(--white);border-radius:9px;border:1px solid var(--border);font-size:13px;line-height:1.75;color:var(--ink-light)}
.advice-num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;text-align:center;line-height:22px;font-size:11px;font-weight:700;margin-right:7px;flex-shrink:0}

.hidden{display:none!important}

/* 对比面板 */
.compare-radar-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.compare-table{width:100%;border-collapse:collapse;font-size:12px}
.compare-table th,.compare-table td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
.compare-table th{font-weight:600;color:var(--ink-light);font-size:11px}
.compare-table .dim-name{text-align:left;font-weight:600}
.compare-table .diff-pos{color:var(--green)}
.compare-table .diff-neg{color:var(--red)}
.compare-bar-wrap{display:flex;align-items:center;gap:4px}
.compare-bar-a{height:6px;background:var(--red);border-radius:3px}
.compare-bar-b{height:6px;background:var(--blue);border-radius:3px}

@media print{
  body{background:#fff;color:#000;font-size:12px}
  .tabs,.btn,.footer-note,.filter-bar,#tab-import,.modal-close{display:none!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:8px;padding:12px 14px}
  .header{padding:12px 0 6px}
  .header h1{color:#000;font-size:20px}
  .header .sub{font-size:11px}
  .stat-card .num{font-size:24px;color:#000}
  .tag{border:1px solid #000;color:#000}
  .chart-row{grid-template-columns:1fr}
  .chart-wrap{max-width:280px!important;margin:0 auto}
  .bar-fill{background:#000!important}
  .domain-card{border-left-color:#000}
  .section-title{border-bottom-color:#ccc}
  .modal-overlay{position:static;display:block!important;background:none;padding:0}
  .modal{box-shadow:none;max-width:100%;padding:12px}
  table{font-size:10px}
  th,td{padding:6px 4px}
}
</style>
</head>
<body>
<div class="container" id="app">

<div class="header">
  <div class="icon">🏫</div>
  <h1>语文学情诊断 · 教师后台</h1>
  <div class="sub">班级学情总览 · 个体根因分析 · 教学培养建议</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="import" onclick="switchTab('import')">📥 数据导入</div>
  <div class="tab" data-tab="overview" onclick="switchTab('overview')">📊 班级总览</div>
  <div class="tab" data-tab="students" onclick="switchTab('students')">👥 学生列表</div>
</div>

<!-- ====== 导入页 ====== -->
<div id="tab-import">
<div class="card">
    <h3>✍️ 手动录入学生数据</h3>
    <p style="font-size:13px;color:var(--ink-light);margin-bottom:10px;">输入五层根因得分（0-100），系统自动判定诊断画像。</p>
    <div id="manual-form">
      <div style="margin-bottom:8px;">
        <label style="font-size:13px;font-weight:600;">学生姓名</label>
        <input id="mf-name" type="text" placeholder="输入姓名" style="width:100%;margin-top:4px;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:13px;font-weight:600;">五层根因得分（0-100）</label>
        <div id="mf-dims" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;"></div>
      </div>
      <button class="btn btn-primary" onclick="manualAdd()">➕ 添加到班级</button>
      <span id="mf-msg" style="margin-left:10px;font-size:13px;"></span>
    </div>
  </div>

  <div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <span style="font-size:13px;color:var(--ink-light);">数据管理：</span>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSONFile(event)">
    <button class="btn btn-outline btn-small" onclick="document.getElementById('import-file').click()">📂 导入JSON文件</button>
    <button class="btn btn-outline btn-small" onclick="exportData()">📤 导出全部数据</button>
    <button class="btn btn-outline btn-small" onclick="refreshFromStorage()">🔄 刷新数据</button>
    <button class="btn btn-danger btn-small" onclick="clearAll()">🗑 清空全部数据</button>
    <span style="font-size:12px;color:var(--ink-light);margin-left:auto;">当前学生数：<b id="total-count">0</b></span>
    <span id="refresh-hint" style="font-size:11px;color:var(--green);display:none;width:100%;"></span>
  </div>
</div>

<!-- ====== 总览页 ====== -->
<div id="tab-overview" class="hidden">
  <div class="stats-row" id="stats-row"></div>
  <div class="chart-row">
    <div class="card"><h4>📊 诊断画像分布</h4><div class="chart-wrap" style="max-width:100%;"><canvas id="chart-type"></canvas></div></div>
    <div class="card"><h4>🎯 班级整体五维根因雷达</h4><div class="chart-wrap" style="max-width:320px;margin:0 auto;"><canvas id="chart-radar"></canvas></div></div>
  </div>
  <div class="card">
    <h4>⚠️ 班级共性薄弱根因排行</h4>
    <div id="weakness-ranking"></div>
  </div>
  <div style="text-align:center;margin-top:8px;">
    <button class="btn btn-outline btn-small" onclick="window.print()">🖨️ 打印班级总览 / 导出PDF</button>
  </div>
</div>

<!-- ====== 学生列表页 ====== -->
<div id="tab-students" class="hidden">
  <div class="filter-bar">
    <span style="font-size:13px;color:var(--ink-light);">按画像筛选：</span>
    <select id="filter-type" onchange="renderStudentList()">
      <option value="all">全部画像</option>
    </select>
    <span style="font-size:13px;color:var(--ink-light);margin-left:8px;">排序：</span>
    <select id="sort-dim" onchange="renderStudentList()">
      <option value="avg">综合均分</option>
      <option value="语基">语基</option>
      <option value="名著">名著</option>
      <option value="古诗文">古诗文</option>
      <option value="阅读">阅读</option>
      <option value="作文">作文</option>
    </select>
  </div>
  <div class="card" style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>姓名</th><th>诊断画像</th><th>解码</th><th>理解</th><th>表达</th><th>策略</th><th>积累</th><th>完成时间</th><th>操作</th>
      </tr></thead>
      <tbody id="student-table-body"><tr><td colspan="9" class="empty-state">暂无学生数据，等待学生完成诊断后自动同步</td></tr></tbody>
    </table>
  </div>

  <!-- 学生对比 -->
  <div class="card" id="compare-card">
    <h3>🔍 学生对比</h3>
    <p style="font-size:12px;color:var(--ink-light);margin-bottom:10px;">选择两名学生进行五层根因和五大板块的全面对比。</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <select id="compare-a" onchange="renderCompare()" style="flex:1;min-width:140px;">
        <option value="">— 选择学生 A —</option>
      </select>
      <span style="color:var(--gold);font-weight:700;font-size:18px;">VS</span>
      <select id="compare-b" onchange="renderCompare()" style="flex:1;min-width:140px;">
        <option value="">— 选择学生 B —</option>
      </select>
    </div>
    <div id="compare-result" class="hidden"></div>
  </div>
</div>

<!-- ====== 个体详情弹窗 ====== -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<div class="footer-note">数据通过云端自动同步，学生完成诊断后即可在此查看</div>
</div>

<script>
// ====== 核心常量（与学生版共用） ======
const ROOT_CAUSES=[{id:0,key:'decode',name:'字词解码',icon:'🔤',sname:'解码层',question:'能否准确识别字词、流畅阅读？',lowMsg:'在识别字词和流畅阅读方面存在困难——这是语文学习最基础的一环。'},{id:1,key:'comprehend',name:'意义理解',icon:'💭',sname:'理解层',question:'能否读懂句子和段落、进行推理？',lowMsg:'能读通字词，但在"读出文字背后的意思"这个环节还需要加强。'},{id:2,key:'express',name:'语言表达',icon:'✍️',sname:'表达层',question:'能否把想法组织成清晰书面语言？',lowMsg:'能理解文章，但把自己的想法写清楚是一个挑战。'},{id:3,key:'strategy',name:'学习策略',icon:'🎯',sname:'策略层',question:'审题、应试、自我监控是否有效？',lowMsg:'语文能力本身没有大问题，但在"怎么学"和"怎么考"的策略层面还有提升空间。'},{id:4,key:'knowledge',name:'知识储备',icon:'📚',sname:'积累层',question:'字词诗句和文学知识是否充足？',lowMsg:'语言基本功底还需要更多积累——成语、古诗文、文学常识等"弹药库"还不够满。'}];

const PROFILES={
P1:{id:'P1',name:'字词解码薄弱型',tag:'基础关卡',icon:'🔤',tagClass:'tag-p1',
  desc:'字词识别和阅读流畅度方面存在基础性困难。这是语文学习最底层的"地基"。',
  studentTitle:'首要任务：打通阅读的第一关',
  parentMsg:'孩子目前在字词识别和阅读流畅度方面需要加强——这是语文学习最基础的一环。',
  parentActions:['每天陪孩子朗读10分钟，遇到不认识的字一起查、一起记','在家里贴一张"本周新字词"，让积累可见','不要急于求成——每天认识3-5个新字词就很好'],
  teacherPriority:'解码层是当前首要干预点。课堂中关注该生朗读表现，及时纠正识字错误。',
  teacherStrategies:['布置"每日5分钟朗读+3个新词"的微习惯作业','使用"字源识字法"——讲字形结构帮助记忆','与家长协调：学校积累和家庭亲子朗读同步进行'],
  teacherMonitor:'两个月内朗读错误率明显下降；字词听写正确率提升10个百分点。',
  priority:[0,1,4,3,2]},
P2:{id:'P2',name:'阅读理解断层型',tag:'意义建构',icon:'💭',tagClass:'tag-p2',
  desc:'能较流畅地阅读字词，但在"读懂文字背后的意思"这个环节出现了断层。',
  studentTitle:'突破口：从"读懂字"到"读懂意"',
  parentMsg:'孩子能较流畅地阅读字词，但在"读懂深层意思"这个环节还需要加强。',
  parentActions:['每天一起读一个小故事，读完后让孩子用自己话讲一遍','问孩子"你觉得作者为什么要写这段"——不要检查对错','在生活中培养"推理"习惯——看到表情猜心情'],

  teacherMonitor:'四周内能独立完成200字段落准确复述；阅读理解正确率提升。',
  priority:[1,3,2,4,0]},
P3:{id:'P3',name:'语言表达阻滞型',tag:'输出转化',icon:'✍️',tagClass:'tag-p3',
  desc:'能理解文章也有自己的想法，但在"把想法组织成清晰文字"这个环节遇到了困难。',

  parentActions:['让孩子先口头讲一遍要写的内容，讲顺了再去写','写完东西后先肯定再提建议','从"三句话日记"开始——每天只写三句'],
  teacherPriority:'表达层是核心障碍。"口头→书面"的转化是主要瓶颈。',

  parentMsg:'孩子能力不差，但在学习方法策略上还需要优化——就像有好车但不太熟悉路线。',
  parentActions:['关注学习习惯多过关注分数——"你是怎么复习的""错题搞懂了吗"','帮孩子准备"错题小本"——写清"为什么错""下次怎么避免"','减少"考了多少分"的追问，增加"哪里比上次进步了"的引导'],
  teacherPriority:'策略训练是"性价比"最高的干预点——能力尚可，策略优化可直提分数。',
  teacherStrategies:['"审题专项"——每周2-3次纯审题训练（圈关键词+判断题型）','"元认知提示卡"——"题在问什么→用什么方法→怎么检查"','"策略复盘"——测试后写两句话的策略反思'],
  teacherMonitor:'三周后审题准确率提升；"粗心失分"比例下降。',
  priority:[3,1,2,4,0]},
P5:{id:'P5',name:'知识储备不足型',tag:'弹药补给',icon:'📚',tagClass:'tag-p5',
  desc:'成语、古诗文、文学常识等"硬知识"的储备还不够。',

// ====== 工具函数 ======
function getLv(s){return s>=68?'high':(s<42?'low':'medium')}
function mapScore(r){return Math.max(1,Math.min(99,Math.round((r-20)/60*98+1)))}
function calcDomainScores(ns){
  var result={};
  for(var dk in DOMAINS){
    var dom=DOMAINS[dk],score=0;
    dom.dims.forEach(function(d){score+=ns[d.i]*d.w;});
    result[dk]=Math.round(score);
  }
  return result;
}

function diagnoseProfile(ns){
  var primary=null;
  if(ns[0]<40) primary='P1';
  else if(ns[1]<40) primary='P2';
  else if(ns[2]<40) primary='P3';
  else if(ns[3]<40) primary='P4';
  else if(ns[4]<40) primary='P5';
  else{
    var lowCount=0;
    for(var i=0;i<5;i++){if(ns[i]<50)lowCount++;}
    if(lowCount>=2) primary='P6';
    else primary='P7';
  }
  return {profileKey:primary,profileObj:PROFILES[primary]};
}

function githubAPI(url, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  if(GITHUB_TOKEN){opts.headers['Authorization'] = 'token ' + GITHUB_TOKEN;}
  return fetch(url, opts).then(function(r){return r.json()}).catch(function(){return null});
}

function fetchFromServer(){
  githubAPI(DATA_API).then(function(files){
    if(!Array.isArray(files)){_studentsCache=[];updateCount();return;}
    var students=[];
    var loaded=0;
    files.forEach(function(f){
      if(f.type!=='file')return;
      fetch(f.download_url).then(function(r){return r.json()}).then(function(data){
        if(data && data.name && data.ns && Array.isArray(data.ns) && data.ns.length===5){
          var cls=diagnoseProfile(data.ns);
          students.push({
            id:f.sha.substring(0,12),
            name:data.name,
            ns:data.ns,
            profileKey:cls.profileKey,
            profileName:cls.profileObj.name,
            profileTag:cls.profileObj.tag,
            ts:data.ts||'',
            notes:data.notes||''
          });
        }
      }).catch(function(){}).then(function(){
        loaded++;
        if(loaded>=files.length){
          var before=_studentsCache.length;
          _studentsCache=students;
          updateCount();
          if(students.length>before&&before>0){
            var hint=document.getElementById('refresh-hint');
            hint.textContent='检测到 '+(students.length-before)+' 名新学生，数据已自动更新';
            hint.style.display='block';hint.style.color='#5B8C5A';
            setTimeout(function(){hint.style.display='none'},5000);
          }
          _lastKnownCount=students.length;
          var activeTab=document.querySelector('.tab.active');
          if(activeTab){
            var tn=activeTab.dataset.tab;
            if(tn==='overview')renderOverview();
            if(tn==='students')renderStudentList();
          }
        }
      });
    });
    if(files.length===0){_studentsCache=[];updateCount();}
  });
}

function addStudent(raw){
  var fname='data/'+encodeURIComponent(raw.name)+'.json';
  var content=JSON.stringify({name:raw.name,ns:raw.ns,ts:raw.ts||new Date().toISOString()});
  var contentB64=btoa(unescape(encodeURIComponent(content)));
  function doPut(sha){
    var body={message:'添加/更新: '+raw.name,content:contentB64,branch:'main'};
    if(sha)body.sha=sha;
    return githubAPI('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+fname,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }
  githubAPI('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+fname).then(function(fileInfo){
    return doPut(fileInfo&&fileInfo.sha?fileInfo.sha:null);
  }).then(function(){
    try{
      var existing=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
      var idx=existing.findIndex(function(s){return s.name===raw.name});
      if(idx>=0)existing[idx]=raw;else existing.push(raw);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(existing));
    }catch(e){}
    fetchFromServer();
  });
  updateCount();
}

function removeStudent(id){
  var student=_studentsCache.find(function(s){return s.id===id});
  if(!student)return;
  var fname='data/'+encodeURIComponent(student.name)+'.json';
  githubAPI('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+fname).then(function(file){
    if(file&&file.sha){
      return githubAPI('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+fname,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'删除: '+student.name,sha:file.sha,branch:'main'})});
    }
  }).then(function(){
    try{
      var existing=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
      existing=existing.filter(function(s){return s.id!==id});
      localStorage.setItem(STORAGE_KEY,JSON.stringify(existing));
    }catch(e){}
    fetchFromServer();
  });
}

    try{
      var data=JSON.parse(e.target.result);
      var arr=Array.isArray(data)?data:[data];
      var success=0,fail=0;
      var toSubmit=[];
      arr.forEach(function(item){
        if(!item.name||!item.ns||!Array.isArray(item.ns)||item.ns.length!==5){fail++;return;}
        var cls=diagnoseProfile(item.ns);
        toSubmit.push({
          id:item.id||(Date.now()+Math.random().toString(36)),
          name:item.name,ns:item.ns,
          profileKey:cls.profileKey,profileName:cls.profileObj.name,profileTag:cls.profileObj.tag,
          ts:item.ts||new Date().toISOString()
        });
        success++;
      });
      var showHint=function(){
        var hint=document.getElementById('refresh-hint');
        hint.textContent='已导入 '+success+' 名学生'+(fail>0?'，'+fail+' 条失败':'');
        hint.style.display='block';hint.style.color=fail>0?'#C77826':'#5B8C5A';
        setTimeout(function(){hint.style.display='none'},4000);
      };
      if(USE_API){
        toSubmit.forEach(function(s){addStudent(s);});
        setTimeout(function(){fetchFromServer();showHint();},2000);
      }else{
        toSubmit.forEach(function(s){addStudent(s);});
        showHint();updateCount();
      }
    }catch(ex){alert('文件解析失败：'+ex.message)}
  };
  reader.readAsText(file);
  event.target.value='';
}

function refreshFromStorage(){
  if(USE_API){fetchFromServer();return;}
  var before=loadStudents().length;
  updateCount();
  var after=loadStudents().length;
  _lastKnownCount=after;
  var hint=document.getElementById('refresh-hint');
  if(after>before){
    hint.textContent='发现 '+(after-before)+' 名新学生数据！';
    hint.style.display='block';hint.style.color='#5B8C5A';
    setTimeout(function(){hint.style.display='none'},4000);
  }else{
    hint.textContent='数据已是最新（共 '+after+' 名学生）';
    hint.style.display='block';hint.style.color='var(--ink-light)';
    setTimeout(function(){hint.style.display='none'},3000);
  }
  var activeTab=document.querySelector('.tab.active');
  if(activeTab){
    var tabName=activeTab.dataset.tab;
    if(tabName==='overview')renderOverview();
    if(tabName==='students')renderStudentList();
  }
}

window.addEventListener('storage',function(e){
  if(e.key===STORAGE_KEY){
    updateCount();
    var hint=document.getElementById('refresh-hint');
    hint.textContent='检测到新数据同步，已自动更新';
    hint.style.display='block';hint.style.color='#5B8C5A';
    setTimeout(function(){hint.style.display='none'},4000);
    var activeTab=document.querySelector('.tab.active');
    if(activeTab){
      var tabName=activeTab.dataset.tab;
      if(tabName==='overview')renderOverview();
      if(tabName==='students')renderStudentList();
    }
  }
});

// ====== 班级总览 ======
function renderOverview(){
  var students=getStudents();
  if(students.length===0){
    document.getElementById('stats-row').innerHTML='<div class="empty-state">暂无学生数据，等待学生完成诊断</div>';
    document.getElementById('weakness-ranking').innerHTML='';
    return;
  }

  // 统计卡片
  var profileCount={};
  students.forEach(function(s){var k=s.profileKey;profileCount[k]=(profileCount[k]||0)+1});
  var topProfile=Object.entries(profileCount).sort(function(a,b){return b[1]-a[1]})[0];
  var avgNs=ROOT_CAUSES.map(function(_,i){
    var sum=students.reduce(function(acc,s){return acc+s.ns[i]},0);
    return Math.round(sum/students.length);
  });
  var avgWeakest=avgNs.map(function(v,i){return {v:v,i:i}}).sort(function(a,b){return a.v-b.v})[0];

  var statsHTML='';
  statsHTML+='<div class="stat-card"><div class="num">'+students.length+'</div><div class="lbl">班级总人数</div></div>';
  statsHTML+='<div class="stat-card"><div class="num">'+Object.keys(profileCount).length+'</div><div class="lbl">涵盖画像数</div></div>';
  statsHTML+='<div class="stat-card"><div class="num">'+(topProfile?PROFILES[topProfile[0]].name:'—')+'</div><div class="lbl">最多画像</div></div>';
  statsHTML+='<div class="stat-card"><div class="num">'+ROOT_CAUSES[avgWeakest.i].sname+'</div><div class="lbl">共性薄弱根因</div></div>';
  document.getElementById('stats-row').innerHTML=statsHTML;

  // 画像分布图
  setTimeout(function(){drawProfileChart(profileCount)},200);

  // 五维雷达图
  setTimeout(function(){drawOverviewRadar(avgNs)},400);

  // 薄弱根因排行
  var ranked=avgNs.map(function(v,i){return {v:v,i:i}}).sort(function(a,b){return a.v-b.v});
  var weakHTML='';
  ranked.forEach(function(item,idx){
    var pct=item.v;
    var color=pct>=68?'var(--green)':(pct>=42?'var(--gold)':'var(--red)');
    weakHTML+='<div class="bar-wrap"><div class="bar-lbl">'+(idx+1)+'. '+ROOT_CAUSES[item.i].sname+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div><div class="bar-val">'+pct+'</div></div>';
  });
  document.getElementById('weakness-ranking').innerHTML=weakHTML;
}

// ====== 学生列表 ======
function renderStudentList(){
  var students=getStudents();
  var filterType=document.getElementById('filter-type').value;
  var sortKey=document.getElementById('sort-dim').value;

  var profileKeys=[...new Set(students.map(function(s){return s.profileKey}))];
  var filterHTML='<option value="all">全部画像</option>';
  profileKeys.forEach(function(k){filterHTML+='<option value="'+k+'">'+PROFILES[k].name+'</option>'});
  document.getElementById('filter-type').innerHTML=filterHTML;
  document.getElementById('filter-type').value=filterType;

  var filtered=students;
  if(filterType!=='all')filtered=filtered.filter(function(s){return s.profileKey===filterType});
  if(sortKey==='avg'){
    filtered.sort(function(a,b){return (b.ns.reduce(function(s,v){return s+v},0)/5)-(a.ns.reduce(function(s,v){return s+v},0)/5)});
  }else{
    filtered.sort(function(a,b){return calcDomainScores(b.ns)[sortKey]-calcDomainScores(a.ns)[sortKey]});
  }

  if(filtered.length===0){
    document.getElementById('student-table-body').innerHTML='<tr><td colspan="9" class="empty-state">暂无匹配的学生数据</td></tr>';
    return;
  }

  var html='';
  filtered.forEach(function(s){
    var p=PROFILES[s.profileKey];
    var date=s.ts?new Date(s.ts).toLocaleDateString('zh-CN'):'—';
    var time=s.ts?new Date(s.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
    html+='<tr>';
    html+='<td class="clickable" onclick="openStudentDetail(\''+s.id+'\')">'+escHtml(s.name)+(s.notes?' <span style="font-size:10px;" title="有教师批注">📝</span>':'')+'</td>';
    html+='<td><span class="tag '+p.tagClass+'">'+p.name+'</span></td>';
    // 五层根因得分
    ROOT_CAUSES.forEach(function(rc,i){
      var v=s.ns[i];
      var color=v>=68?'var(--green)':(v>=42?'var(--gold)':'var(--red)');
      html+='<td style="font-weight:700;color:'+color+'">'+v+'</td>';
    });
    html+='<td style="font-size:12px;white-space:nowrap;">'+date+'<br>'+time+'</td>';
    html+='<td style="white-space:nowrap;"><button class="btn btn-outline btn-small" onclick="event.stopPropagation();openStudentDetail(\''+s.id+'\')">详情</button> <button class="btn btn-danger btn-small" onclick="event.stopPropagation();removeStudent(\''+s.id+'\');renderStudentList();updateCount()">删除</button></td>';
    html+='</tr>';
  });
  document.getElementById('student-table-body').innerHTML=html;
}

function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ====== 个体详情弹窗 ======
function openStudentDetail(id){
  var raw=loadStudents().find(function(s){return s.id===id});
  if(!raw)return;
  var student=Object.assign({},raw,{profileObj:PROFILES[raw.profileKey]||PROFILES['P7']});
  var ns=student.ns,p=student.profileObj;
  var ranked=ns.map(function(v,i){return {v:v,i:i}}).sort(function(a,b){return b.v-a.v});
  var weakRC=ranked[ranked.length-1];

  // 计算班级均值
  var allStudents=loadStudents();
  var avgNs=null;
  if(allStudents.length>=2){
    avgNs=[0,0,0,0,0];
    var count=0;
    allStudents.forEach(function(s){
      if(s.id!==id&&s.ns&&s.ns.length===5){
        for(var i=0;i<5;i++)avgNs[i]+=s.ns[i];
        count++;
      }
    });
    if(count>0)for(var i=0;i<5;i++)avgNs[i]=Math.round(avgNs[i]/count);
    else avgNs=null;
  }

  var domainScores=calcDomainScores(ns);
  var rcExp=RC_EXP[weakRC.i][getLv(ns[weakRC.i])];

  var html='';
  html+='<button class="modal-close" onclick="closeModal()">✕</button>';

  // 头部
  html+='<div style="text-align:center;margin-bottom:16px;">';
  html+='<h2 style="color:var(--red);margin-bottom:4px;">'+escHtml(student.name)+'</h2>';
  html+='<span class="tag '+p.tagClass+'" style="font-size:14px;padding:6px 16px;">'+p.name+' · '+p.tag+'</span>';
  html+='<p style="font-size:13px;color:var(--ink-light);margin-top:8px;">'+p.desc+'</p>';
  if(student.ts)html+='<p style="font-size:11px;color:var(--ink-light);">诊断日期：'+new Date(student.ts).toLocaleDateString('zh-CN')+'</p>';
  html+='<button class="btn btn-outline btn-small" onclick="event.stopPropagation();printStudentReport()" style="margin-top:8px;">🖨️ 打印此报告</button>';
  html+='</div>';

  // 五维雷达
  html+='<div class="card"><h4>🎯 五层根因雷达'+(avgNs?'<span style="font-size:11px;color:var(--blue);font-weight:400;">（虚线 = 班级均值）</span>':'')+'</h4><div class="chart-wrap" style="max-width:320px;margin:0 auto;"><canvas id="chart-indiv-radar"></canvas></div></div>';

  // 五层根因解读
  html+='<div class="card"><h4>📋 五层根因解读</h4>';
  ROOT_CAUSES.forEach(function(rc){
    var lv=getLv(ns[rc.id]),exp=RC_EXP[rc.id][lv];
    var color=lv==='high'?'var(--green)':(lv==='medium'?'var(--gold)':'var(--red)');
    var label=lv==='high'?'优势':(lv==='medium'?'适中':'待提升');
    html+='<div style="margin-bottom:10px;padding:8px 12px;background:var(--white);border-radius:8px;border-left:3px solid '+color+';">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">';
    html+='<strong>'+rc.icon+' '+rc.name+'</strong>';
    html+='<span style="font-size:12px;color:'+color+';font-weight:600;">'+ns[rc.id]+'分 · '+label+'</span></div>';
    html+='<p style="font-size:12px;color:var(--ink-light);line-height:1.7;margin:0;">'+exp.desc+'</p>';
    html+='</div>';
  });
  html+='</div>';

  // 五大板块
  html+='<div class="card"><h4>📊 语文五大板块</h4>';
  for(var dk in DOMAINS){
    var dom=DOMAINS[dk],ds=domainScores[dk];
    var dcolor=ds>=68?'var(--green)':(ds>=42?'var(--gold)':'var(--red)');
    html+='<div class="domain-card">';
    html+='<strong>'+dom.name+'</strong><span class="domain-score" style="color:'+dcolor+'">'+ds+' 分</span>';
    html+='<p style="font-size:12px;color:var(--ink-light);margin:4px 0 0;">'+dom.desc+'</p>';
    html+='</div>';
  }
  html+='</div>';

  // 教学培养案
  html+='<div class="card"><h4>📝 教学培养案</h4>';
  html+='<p style="font-size:12px;color:var(--ink-light);margin-bottom:6px;"><strong>诊断概要：</strong>'+p.name+' — '+p.studentTitle+'</p>';
  html+='<p style="font-size:12px;color:var(--ink-light);margin-bottom:10px;"><strong>教学优先级：</strong>'+p.teacherPriority+'</p>';
  html+='<p style="font-size:12px;color:var(--ink-light);margin-bottom:8px;"><strong>推荐课堂策略：</strong></p>';
  p.teacherStrategies.forEach(function(s,i){
    html+='<div class="advice-item" style="margin-bottom:8px;"><span class="advice-num">'+(i+1)+'</span>'+s+'</div>';
  });
  html+='<p style="font-size:12px;color:var(--ink-light);margin-top:8px;"><strong>📏 监控指标：</strong>'+p.teacherMonitor+'</p>';
  html+='</div>';

  // 教师批注
  html+='<div class="card"><h4>✏️ 教师批注</h4>';
  html+='<textarea id="note-'+student.id+'" placeholder="在此添加对 '+escHtml(student.name)+' 的教学观察和批注..." style="min-height:80px;">'+(student.notes||'')+'</textarea>';
  html+='<div style="margin-top:6px;display:flex;gap:8px;align-items:center;">';
  html+='<button class="btn btn-primary btn-small" onclick="saveTeacherNote(\''+student.id+'\')">💾 保存批注</button>';
  html+='<span id="note-msg-'+student.id+'" style="font-size:12px;"></span></div></div>';

  // 家校共育建议
  html+='<div class="card"><h4>🏠 家校共育建议</h4>';
  html+='<div class="section-title">📌 给家长的关键告知</div>';
  html+='<p style="font-size:13px;line-height:1.85;color:var(--ink-light);">'+p.parentMsg+'</p>';
  html+='<div class="section-title">🏡 在家可以这样做</div>';
  p.parentActions.forEach(function(a,i){
    html+='<div style="margin-bottom:6px;font-size:13px;line-height:1.7;color:var(--ink-light);"><strong>'+(i+1)+'.</strong> '+a+'</div>';
  });
  var commTiming=getLv(ns[weakRC.i])==='low'?'建议每两周与语文老师沟通一次，了解孩子在该根因维度的进展。':'建议每月与语文老师沟通一次，关注孩子在薄弱维度的改善迹象。';
  html+='<div class="section-title">📞 建议沟通时机</div>';
  html+='<p style="font-size:13px;line-height:1.85;color:var(--ink-light);">'+commTiming+'</p>';
  html+='</div>';

  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(function(){drawIndivRadar('chart-indiv-radar',ns,avgNs)},300);
}

function printStudentReport(){
  var modal=document.querySelector('.modal');
  var btns=modal.querySelectorAll('.btn,.modal-close,textarea');
  btns.forEach(function(b){b.style.display='none'});
  window.print();
  btns.forEach(function(b){b.style.display=''});
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
  var canvas=document.getElementById('chart-indiv-radar');
  if(canvas){var ctx=canvas.getContext('2d');if(ctx._chart)ctx._chart.destroy();}
}

// ====== 教师批注保存 ======
function saveTeacherNote(id){
  var student=loadStudents().find(function(s){return s.id===id});
  if(!student)return;
  var ta=document.getElementById('note-'+id);
  var notes=ta?ta.value.trim():'';
  student.notes=notes;
  var fname='data/'+encodeURIComponent(student.name)+'.json';
  var content=JSON.stringify({name:student.name,ns:student.ns,ts:student.ts||'',notes:notes});
  githubAPI('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+fname).then(function(fileInfo){
    var body={message:'批注: '+student.name,content:btoa(unescape(encodeURIComponent(content))),branch:'main'};
    if(fileInfo&&fileInfo.sha)body.sha=fileInfo.sha;
    return githubAPI('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+fname,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }).then(function(){
    var msgEl=document.getElementById('note-msg-'+id);
    if(msgEl){msgEl.textContent='已保存';msgEl.style.color='#5B8C5A';setTimeout(function(){msgEl.textContent=''},2000);}
  }).catch(function(){
    var msgEl=document.getElementById('note-msg-'+id);
    if(msgEl){msgEl.textContent='保存失败';msgEl.style.color='var(--red)';}
  });
}

// ====== Chart.js ======
let chartLoaded=false,chartLoading=false,chartCbs=[];
function loadChart(cb){
  if(chartLoaded){cb();return}
  chartCbs.push(cb);if(chartLoading)return;chartLoading=true;
  var urls=['https://registry.npmmirror.com/chart.js/4.4.0/files/dist/chart.umd.min.js','https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js','https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'];
  function tryLoad(i){
    if(i>=urls.length){chartLoaded=true;chartLoading=false;chartCbs.forEach(function(c){c()});chartCbs=[];return}
    var s=document.createElement('script');s.src=urls[i];
    s.onload=function(){chartLoaded=true;chartLoading=false;chartCbs.forEach(function(c){c()});chartCbs=[]};
    s.onerror=function(){tryLoad(i+1)};document.head.appendChild(s)
  }
  tryLoad(0)
}

var CHART_COLORS=['#B83A2A','#C77826','#4A7B9D','#8B7355','#5B8C5A','#B8860B','#9B4D7A','#5B7A9D'];

function drawProfileChart(profileCount){
  var canvas=document.getElementById('chart-type');
  if(!canvas)return;
  loadChart(function(){
    var labels=[],data=[],colors=[];
    var i=0;
    for(var k in profileCount){
      labels.push(PROFILES[k].name);data.push(profileCount[k]);colors.push(CHART_COLORS[i%CHART_COLORS.length]);i++;
    }
    var ctx=canvas.getContext('2d');
    if(ctx._chart)ctx._chart.destroy();
    ctx._chart=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});
  });
}

function drawOverviewRadar(ns){
  var canvas=document.getElementById('chart-radar');
  if(!canvas)return;
  loadChart(function(){
    var ctx=canvas.getContext('2d');
    if(ctx._chart)ctx._chart.destroy();
    ctx._chart=new Chart(ctx,{type:'radar',data:{labels:ROOT_CAUSES.map(function(d){return d.icon+' '+d.sname}),datasets:[{data:ns,backgroundColor:'rgba(184,58,42,0.10)',borderColor:'#B83A2A',borderWidth:2,pointBackgroundColor:'#B83A2A',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{stepSize:20,backdropColor:'transparent',font:{size:10}},pointLabels:{font:{size:11}},grid:{color:'#E0D5C9'},angleLines:{color:'#E0D5C9'}}}}});
  });
}

function drawIndivRadar(id,ns,avgNs){
  var canvas=document.getElementById(id);
  if(!canvas)return;
  loadChart(function(){
    var ctx=canvas.getContext('2d');
    if(ctx._chart)ctx._chart.destroy();
    var datasets=[{data:ns,label:'该生',backgroundColor:'rgba(184,58,42,0.10)',borderColor:'#B83A2A',borderWidth:2,pointBackgroundColor:'#B83A2A',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5}];
    if(avgNs&&Array.isArray(avgNs)&&avgNs.length===5){
      datasets.push({data:avgNs,label:'班级均值',backgroundColor:'rgba(74,123,157,0.05)',borderColor:'#4A7B9D',borderWidth:1.5,borderDash:[6,3],pointBackgroundColor:'#4A7B9D',pointBorderColor:'#fff',pointBorderWidth:1,pointRadius:3});
    }
    ctx._chart=new Chart(ctx,{type:'radar',data:{labels:ROOT_CAUSES.map(function(d){return d.icon+' '+d.sname}),datasets:datasets},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:!!avgNs,position:'bottom',labels:{font:{size:10},padding:12}}},scales:{r:{min:0,max:100,ticks:{stepSize:20,backdropColor:'transparent',font:{size:10}},pointLabels:{font:{size:11}},grid:{color:'#E0D5C9'},angleLines:{color:'#E0D5C9'}}}}});
  });
}

// ====== 初始化 ======
let _lastKnownCount=0;
function init(){
  initManualForm();
  if(USE_API){
    fetchFromServer();
    _lastKnownCount=0;
    setInterval(fetchFromServer,4000);
  }else{
    _lastKnownCount=loadStudents().length;
    setInterval(function(){
      var current=loadStudents().length;
      if(current>_lastKnownCount){
        var diff=current-_lastKnownCount;
        _lastKnownCount=current;
        updateCount();
        var hint=document.getElementById('refresh-hint');
        hint.textContent='检测到 '+diff+' 名新学生完成诊断，数据已自动更新';
        hint.style.display='block';hint.style.color='#5B8C5A';
        setTimeout(function(){hint.style.display='none'},5000);
        var activeTab=document.querySelector('.tab.active');
        if(activeTab){
          var tn=activeTab.dataset.tab;
          if(tn==='overview')renderOverview();
          if(tn==='students')renderStudentList();
        }
      }
    },5000);
  }
  updateCount();
  switchTab('import');
  if(USE_API){
    setTimeout(function(){
      var hint=document.getElementById('refresh-hint');
      hint.textContent='服务器模式：学生完成诊断后自动同步到此处';
      hint.style.display='block';hint.style.color='var(--blue)';
      setTimeout(function(){hint.style.display='none'},4000);
    },500);
  }
}
init();
